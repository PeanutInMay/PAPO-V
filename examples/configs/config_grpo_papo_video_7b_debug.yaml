data:
  train_files: /path/to/your/video_train_data  
  val_files: /path/to/your/video_val_data      
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 1.0          # keep low to limit frame count per video
  max_prompt_length: 8192  # video prompts are much longer than image
  max_response_length: 1024
  rollout_batch_size: 128  # reduced from 384 (image) due to much longer video sequences
  mini_rollout_batch_size: null
  val_batch_size: 256
  format_prompt: examples/format_prompt/math_perception.jinja
  override_chat_template: null
  shuffle: true
  seed: 1
  max_pixels: 401408  # 512*28*28, conservative for video frames
  min_pixels: 200704  # 256*28*28
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99

  use_kl_prcp: true
  contrastive_type: augmented
  kl_prcp_penalty: low_var_kl
  kl_prcp_coef: 1.0e-2
  kl_prcp_apply_mode: all
  incorrect_weighting: 0.1
  aug_config:
    patch_size: 14
    black_prob: 0.6
    # Spatial augmentation modes for video (can be enabled/disabled independently):
    # All four modes can be combined and are applied in sequence:
    #   1. Spatial Consistent -> 2. Spatial Random -> 3. Temporal Blackout -> 4. Temporal Shuffle
    enable_spatial_consistent: true   # All frames use the same spatial mask
    enable_spatial_random: false      # Each frame has independent spatial mask
    # Temporal blackout: randomly blackout consecutive frames
    enable_temporal_blackout: false
    blackout_ratio: 0.5  # Ratio of frames to blackout (e.g., 0.5 = 50% of frames)
    # Temporal shuffle: shuffle segments of frames
    enable_temporal_shuffle: false
    shuffle_ratio: 0.5  # Ratio of segments to shuffle (e.g., 0.5 = 50% of segments)
    min_segment_len: 1  # Minimum segment length for shuffling
    max_segment_len: 4  # Maximum segment length for shuffling
  kl_prcp_schedule: fixed
  kl_prcp_schedule_args:
    start_value: 1.0e-2
    end_value: 0.0
    annealing_ratio: 0.5

  use_aug_entropy_loss: false
  aug_entropy_loss_coef: 0.03

  use_ori_entropy_loss: false
  ori_entropy_loss_coef: 0.03

worker:
  actor:
    global_batch_size: 128  # equivalent to verl's actor.ppo_mini_batch_size
    micro_batch_size_per_device_for_update: 2       # halved vs image (7B model larger)
    micro_batch_size_per_device_for_experience: 2   # keep small: video pixel_values are huge
    max_grad_norm: 1.0
    padding_free: true
    ulysses_size: 1
    model:
      model_path: /path/to/Qwen2.5-VL-7B-Instruct  # TODO: replace with actual path
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.0
    fsdp:
      torch_dtype: bf16
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true   # CPU offload frees GPU for video pixel_values
      offload_optimizer: true

  rollout:
    n: 5
    temperature: 1.0
    top_p: 0.99
    limit_images: 0
    gpu_memory_utilization: 0.55  # slightly lower than image to leave room for video tensors
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 2   # TP=2 for larger KV cache (long video contexts)
    max_num_batched_tokens: 16384  # >= max_prompt_length + max_response_length
    disable_tqdm: false
    val_override_config:
      temperature: 1.0
      n: 4  # reduced from 8 to save val time on video data

  ref:
    fsdp:
      torch_dtype: bf16
      enable_full_shard: true
      enable_cpu_offload: true  # ref model always on CPU offload
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: batch
    reward_function: examples/reward_function/math.py:compute_score

trainer:
  total_epochs: 2
  max_steps: null
  project_name: easy_r1
  experiment_name: qwen2_5_vl_7b_grpo_papo_video
  logger: ["console", "wandb"]
  nnodes: 1
  n_gpus_per_node: 4
  max_try_make_batch: 20
  val_freq: 5       # -1 to disable
  val_before_train: true
  val_only: false
  val_generations_to_log: 3
  save_freq: 5      # -1 to disable
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null
  save_best_checkpoint: true
